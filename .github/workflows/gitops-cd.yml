name: GitOps Continuous Delivery

on:
  pull_request:
    branches:
      - main

jobs:
  generate-gitops-manifests:
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install Helmfile
        run: |
          wget -O helmfile.tar.gz https://github.com/helmfile/helmfile/releases/download/v0.163.1/helmfile_0.163.1_linux_amd64.tar.gz
          tar -xzf helmfile.tar.gz
          sudo mv helmfile /usr/local/bin/helmfile
          sudo chmod +x /usr/local/bin/helmfile
          helmfile version

      - name: Install dependencies
        run: make install-deps

      - name: Generate GitOps manifests
        run: make generate-gitops

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain gitops)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push GitOps manifests
        if: steps.check_changes.outputs.has_changes == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A gitops/
          git commit -m "chore: update GitOps manifests [skip ci]" || exit 0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push origin HEAD:main
          fi
